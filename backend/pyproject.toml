[project]
name = "labchain-backend"
version = "0.1.0"
requires-python = ">=3.12"
description = "LabChain modular monolith"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
